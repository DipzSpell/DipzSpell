# Builds the stats cards for the profile README and saves them in this repo,
# so the README no longer depends on the shared public servers that keep going down.
name: Update profile cards

on:
  schedule:
    - cron: "30 21 * * *"        # every day, 3:00 AM IST
  workflow_dispatch:              # "Run workflow" button in the Actions tab
  push:
    paths:
      - ".github/workflows/profile-cards.yml"   # runs once when this file is added or edited

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=DipzSpell&show_icons=true&theme=tokyonight&hide_border=true&bg_color=0B0E14&title_color=22D3EE&icon_color=A3E635&text_color=c9d1d9
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=DipzSpell&layout=compact&theme=tokyonight&hide_border=true&bg_color=0B0E14&title_color=22D3EE&text_color=c9d1d9
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: DipzSpell
          outputs: |
            profile/contributions-dark.svg?color_snake=#A3E635&color_dots=#161B22,#0E4B5A,#117A8B,#1AA8BF,#22D3EE
            profile/contributions-light.svg?color_snake=#0B0E14&color_dots=#EBEDF0,#A5F3FC,#67E8F9,#22D3EE,#0891B2

      - name: Save the cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update profile cards" || exit 0
          git push
